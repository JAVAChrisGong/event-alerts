<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>重大事件提醒 · 股市日历</title>
<style>
  :root{
    --bg:#0b0f1a; --card:#141b2d; --card2:#101626; --line:#232c44;
    --txt:#e8edf7; --muted:#8b96ad; --gold:#ffd166; --cyan:#4cc9f0; --red:#ef476f;
    --green:#2ec27e; --grad:linear-gradient(135deg,#4cc9f0,#7b8cff 55%,#ffd166);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:radial-gradient(1200px 600px at 20% -10%, #172244 0%, var(--bg) 55%) fixed, var(--bg);
    color:var(--txt); min-height:100vh; padding:20px 16px 60px;
  }
  .wrap{max-width:1180px; margin:0 auto;}
  /* ---------- 顶部 ---------- */
  header{display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:12px; margin-bottom:18px;}
  h1{font-size:26px; letter-spacing:1px; background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent;}
  h1 small{font-size:13px; color:var(--muted); -webkit-text-fill-color:var(--muted); letter-spacing:0; margin-left:8px; font-weight:400;}
  .clock{font-size:13px; color:var(--muted); text-align:right; line-height:1.7;}
  .clock b{color:var(--cyan); font-weight:600;}
  /* ---------- 统计 ---------- */
  .stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:14px;}
  .stat{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px;}
  .stat b{display:block; font-size:18px; color:var(--gold); margin-bottom:2px;}
  .stat span{font-size:12px; color:var(--muted);}
  /* ---------- 过滤 ---------- */
  .filters{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; align-items:center;}
  .filters button{
    background:var(--card); color:var(--txt); border:1px solid var(--line);
    border-radius:999px; padding:7px 14px; font-size:13px; cursor:pointer; transition:.15s;
  }
  .filters button.on{background:var(--grad); color:#0b0f1a; border-color:transparent; font-weight:600;}
  .filters button:hover{border-color:var(--cyan);}
  .filters .spacer{flex:1;}
  .filters .ghost{background:transparent; border-color:var(--line); color:var(--muted); font-size:12px;}
  .filters .divider{width:1px; height:20px; background:var(--line); margin:0 4px;}
  .view-btn{font-weight:600;}
  .histbar{display:flex; flex-wrap:wrap; align-items:center; gap:10px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 14px; margin-bottom:16px; font-size:13px; color:var(--muted);}
  .histbar .spacer{flex:1;}
  .histbar input[type=date]{background:var(--card2); color:var(--txt); border:1px solid var(--line); border-radius:8px; padding:5px 8px; font-size:13px;}
  .histbar .hy{background:var(--card2); color:var(--txt); border:1px solid var(--line); border-radius:999px; padding:5px 11px; font-size:12px; cursor:pointer;}
  .histbar .hy.on{background:var(--grad); color:#0b0f1a; border-color:transparent; font-weight:600;}
  .histbar .hy:hover{border-color:var(--cyan);}
  .histbar #histRange{color:var(--gold); font-variant-numeric:tabular-nums;}
  /* ---------- 历史详情页 ---------- */
  #detailView{max-width:1180px; margin:0 auto; padding:0 16px 60px;}
  .ghost-btn{background:var(--card); color:var(--txt); border:1px solid var(--line); border-radius:10px; padding:8px 16px; font-size:13px; cursor:pointer; margin-bottom:14px;}
  .ghost-btn:hover{border-color:var(--cyan);}
  .detail-head{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px 20px; margin-bottom:16px;}
  .detail-head .badges{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px;}
  .detail-head h2{font-size:22px; margin-bottom:6px; line-height:1.35;}
  .detail-head .org{font-size:12.5px; color:var(--muted); margin-bottom:10px;}
  .detail-head .impact{font-size:13px; color:#b9c3d8; line-height:1.7; margin-bottom:8px;}
  .detail-head .impact b{color:var(--cyan);}
  .detail-head .note{font-size:12px; color:var(--muted); line-height:1.6;}
  .points-block{margin-top:14px; border-top:1px dashed var(--line); padding-top:14px;}
  .points-block h3{font-size:14px; color:var(--cyan); margin-bottom:10px;}
  .point{display:flex; gap:10px; margin-bottom:10px;}
  .p-num{flex:none; width:22px; height:22px; border-radius:50%; background:var(--card2); border:1px solid var(--line); color:var(--gold); font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center; margin-top:1px;}
  .p-text{font-size:13px; color:var(--txt); line-height:1.6;}
  .p-impact{font-size:12.5px; color:#b9c3d8; line-height:1.6; margin-top:3px;}
  .p-impact b{color:var(--cyan);}
  .bullbear{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:14px; border-top:1px dashed var(--line); padding-top:14px;}
  .bb{background:var(--card2); border:1px solid var(--line); border-radius:10px; padding:10px 12px;}
  .bb h4{font-size:13px; margin-bottom:6px;}
  .bb.bull h4{color:var(--red);}
  .bb.bear h4{color:var(--green);}
  .bb ul{padding-left:16px; margin:0;}
  .bb li{font-size:12.5px; color:#b9c3d8; line-height:1.7;}
  @media (max-width:560px){ .bullbear{grid-template-columns:1fr;} }
  .chart-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:14px;}
  .chart-card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 12px 8px;}
  .chart-card h3{font-size:14px; display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px;}
  .chart-card h3 small{color:var(--muted); font-weight:400; font-size:11px;}
  .chart-card canvas{width:100%; height:300px; display:block;}
  .chart-slider{display:flex; align-items:center; gap:8px; margin-top:6px;}
  .chart-slider input[type=range]{flex:1; accent-color:var(--gold); height:4px; cursor:pointer;}
  .chart-slider .win-label{font-size:10.5px; color:var(--muted); min-width:52px; text-align:right; font-variant-numeric:tabular-nums;}
  .chart-legend{font-size:10.5px; color:var(--muted); margin-top:2px; display:flex; flex-wrap:wrap; gap:10px; align-items:center;}
  .chart-legend i{display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:3px; vertical-align:middle;}
  .chart-meta{font-size:11px; color:var(--muted); margin-top:4px; display:flex; justify-content:space-between; font-variant-numeric:tabular-nums;}
  .data-table-block{margin-top:14px; border-top:1px dashed var(--line); padding-top:14px;}
  .data-table-block h3{font-size:14px; color:var(--cyan); margin-bottom:10px;}
  .data-table{width:100%; border-collapse:collapse; font-size:12.5px;}
  .data-table th{color:var(--muted); font-weight:400; text-align:left; padding:6px 8px; border-bottom:1px solid var(--line);}
  .data-table td{padding:6px 8px; border-bottom:1px solid rgba(35,44,68,.5); color:#b9c3d8;}
  .data-note{font-size:11.5px; color:var(--muted); margin-top:8px; line-height:1.6;}
  .chart-hint{font-size:12px; color:var(--muted); margin-top:12px; line-height:1.7;}
  /* ---------- 卡片 ---------- */
  #cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); gap:14px;}
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:16px 16px 12px; position:relative; overflow:hidden; transition:.2s;
  }
  .card:hover{transform:translateY(-2px); border-color:#33406a;}
  .card.S{border-left:3px solid var(--red); background:linear-gradient(160deg,#1a2038,#141b2d 60%);}
  .card.A{border-left:3px solid var(--cyan);}
  .card.B{border-left:3px solid #3a4763;}
  .card.past{opacity:.45;}
  .card-head{display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-bottom:8px;}
  .badge{font-size:11px; padding:2px 8px; border-radius:999px; border:1px solid var(--line); color:var(--muted);}
  .badge.lv{font-weight:700; color:#0b0f1a; border:none;}
  .badge.hot{color:var(--gold); border-color:var(--gold); font-weight:600;}
  .lv.S{background:var(--red);} .lv.A{background:var(--cyan);} .lv.B{background:#3a4763; color:var(--txt);}
  .date{font-size:12px; color:var(--muted); margin-left:auto;}
  .card h2{font-size:17px; margin-bottom:2px; line-height:1.35;}
  .card .org{font-size:12px; color:var(--muted); margin-bottom:10px;}
  /* ---------- 倒计时 ---------- */
  .cd{display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap; align-items:baseline;}
  .cd .num{background:var(--card2); border:1px solid var(--line); border-radius:8px; padding:4px 9px; font-size:20px; font-weight:700; color:var(--gold); font-variant-numeric:tabular-nums; min-width:52px; text-align:center; line-height:1.2;}
  .cd .u{font-size:11px; color:var(--muted); align-self:flex-end; margin-bottom:5px;}
  .cd .done{font-size:14px; color:var(--green); font-weight:600;}
  .cd .live{font-size:14px; color:var(--gold); font-weight:600; animation:blink 1.6s infinite;}
  @keyframes blink{50%{opacity:.55;}}
  .impact{font-size:12.5px; color:#b9c3d8; line-height:1.6; margin-bottom:10px;}
  .impact b{color:var(--cyan);}
  .note{font-size:11.5px; color:var(--muted); line-height:1.5; margin-bottom:10px; border-top:1px dashed var(--line); padding-top:8px;}
  /* ---------- 提醒行 ---------- */
  .remind{display:flex; flex-wrap:wrap; align-items:center; gap:8px; font-size:12.5px; color:var(--muted); border-top:1px solid var(--line); padding-top:10px;}
  .remind label{display:flex; align-items:center; gap:6px; cursor:pointer; color:var(--txt);}
  .remind input[type=checkbox]{accent-color:var(--gold); width:15px; height:15px; cursor:pointer;}
  .remind input[type=number]{
    width:44px; background:var(--card2); color:var(--txt); border:1px solid var(--line);
    border-radius:6px; padding:3px 4px; font-size:13px; text-align:center; font-variant-numeric:tabular-nums;
  }
  .remind input[type=number]:focus{outline:1px solid var(--cyan);}
  .remind .unit{font-size:12px; color:var(--muted);}
  .remind .test{
    margin-left:auto; background:transparent; border:1px solid var(--line); color:var(--cyan);
    border-radius:8px; padding:4px 10px; font-size:12px; cursor:pointer;
  }
  .remind .test:hover{border-color:var(--cyan);}
  .remind .fired{color:var(--green); font-size:11px;}
  /* ---------- 弹窗通知 ---------- */
  #modal{
    position:fixed; inset:0; background:rgba(4,6,14,.72); backdrop-filter:blur(3px);
    display:none; align-items:center; justify-content:center; z-index:99; padding:20px;
  }
  #modal.show{display:flex;}
  .modal-box{
    background:linear-gradient(160deg,#1d2440,#131a2e); border:1px solid #3a4763;
    border-radius:18px; padding:26px 28px; max-width:460px; width:100%; box-shadow:0 20px 60px rgba(0,0,0,.5);
    animation:pop .25s ease;
  }
  @keyframes pop{from{transform:scale(.92); opacity:0;} to{transform:scale(1); opacity:1;}}
  .modal-box .bell{font-size:40px; margin-bottom:8px;}
  .modal-box h3{font-size:13px; color:var(--gold); letter-spacing:2px; margin-bottom:10px;}
  .modal-box .ev{font-size:20px; font-weight:700; line-height:1.4; margin-bottom:6px;}
  .modal-box .cdline{font-size:15px; color:var(--cyan); margin-bottom:16px; font-variant-numeric:tabular-nums;}
  .modal-box .sub{font-size:12.5px; color:var(--muted); line-height:1.6; margin-bottom:18px;}
  .modal-box button{
    width:100%; background:var(--grad); color:#0b0f1a; border:none; border-radius:10px;
    padding:11px; font-size:15px; font-weight:700; cursor:pointer;
  }
  /* ---------- 页脚 ---------- */
  footer{margin-top:28px; text-align:center; font-size:11.5px; color:var(--muted); line-height:1.9;}
  footer a{color:var(--cyan); text-decoration:none;}
  @media (max-width:560px){
    h1{font-size:20px;}
    .card h2{font-size:15.5px;}
    .cd .num{font-size:16px; min-width:44px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>重大事件提醒 <small>最近一年 · 能搅动股市的大事（国内 + 国外）</small></h1>
    <div class="clock">
      <div>今天是 <b id="today">—</b> <span id="liveClock"></span></div>
      北京时间 · 倒计时自动更新
    </div>
  </header>

  <div class="stats">
    <div class="stat"><b id="statNext">—</b><span>距最近的大事件</span></div>
    <div class="stat"><b id="statAlerts">0</b><span>已开启提醒的事件</span></div>
    <div class="stat"><b id="statFired">0</b><span>已触发提醒</span></div>
    <div class="stat" style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
      <span style="font-size:12px;">系统通知</span>
      <button id="btnNotify" class="test" style="margin-left:auto;background:var(--card2);border:1px solid var(--line);color:var(--cyan);border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer;">开启</button>
    </div>
  </div>

  <div class="filters">
    <button class="view-btn on" data-view="future">📅 未来</button>
    <button class="view-btn" data-view="history">🕰️ 历史</button>
    <span class="divider"></span>
    <button data-f="all" class="on">全部</button>
    <button data-f="cn">🇨🇳 国内</button>
    <button data-f="overseas">🌍 海外</button>
    <button data-f="policy">🏦 央行·政策</button>
    <button data-f="tech">💡 科技</button>
    <button data-f="alerted">🔔 已设提醒</button>
    <span class="spacer"></span>
    <button class="ghost" id="btnOnlineUpdate">🔄 更新行情</button>
    <button class="ghost" id="btnReset">重置全部提醒</button>
  </div>

  <div class="histbar" id="histBar" style="display:none">
    <span>回顾窗口</span>
    <input type="date" id="histEnd">
    <span>↔ 往前一年</span>
    <span id="histRange">—</span>
    <span class="spacer"></span>
    <button class="hy on" data-y="recent">最近一年</button>
    <button class="hy" data-y="2025">2025</button>
    <button class="hy" data-y="2024">2024</button>
    <button class="hy" data-y="2023">2023</button>
    <button class="hy" data-y="2022">2022</button>
    <button class="hy" data-y="2021">2021</button>
    <button class="hy" data-y="2020">2020</button>
  </div>

  <div id="cards"></div>

  <div id="detailView" style="display:none">
    <button id="btnBack" class="ghost-btn">← 返回历史</button>
    <div id="detailHead" class="detail-head"></div>
    <div id="chartGrid" class="chart-grid"></div>
    <div id="chartHint" class="chart-hint"></div>
  </div>

  <footer>
    日期说明：标注「预计」的会议按往年惯例推算，正式日期以官方公布为准（APK 发布前将逐条核对）。<br>
    本页为网页演示版 · 数据保存在本机浏览器（localStorage），刷新不丢失。
  </footer>
</div>

<div id="modal">
  <div class="modal-box">
    <div class="bell">⏰</div>
    <h3>重大事件提醒</h3>
    <div class="ev" id="mEv">—</div>
    <div class="cdline" id="mCd">—</div>
    <div class="sub" id="mSub">—</div>
    <button id="mClose">我知道了</button>
  </div>
</div>

<script src="data/indices.js"></script>
<script>
"use strict";

function tplKeyOf(title) {
  for (const [kw, key] of TPL_MAP) {
    if (title.includes(kw)) return key;
  }
  return null;
}

// 匹配：先查特别事件内容，再按标题匹配模板
function contentFor(ev) {
  if (!ev) return null;
  if (EVENT_CONTENT[ev.id]) return EVENT_CONTENT[ev.id];
  const key = tplKeyOf(ev.title);
  return key && TPL[key] ? TPL[key] : null;
}

// 利好 / 利空方向
function bullbearFor(ev) {
  if (!ev) return null;
  if (EVENT_BB[ev.id]) return EVENT_BB[ev.id];
  const key = tplKeyOf(ev.title);
  return key && TPL_BB[key] ? TPL_BB[key] : null;
}

/* ============ 2. 工具函数 ============ */
const WEEK = ["日","一","二","三","四","五","六"];
const LS_KEY = "eventRadar.v1";
const now = () => Date.now();

function fmtDate(ts){
  const d = new Date(ts);
  return d.getFullYear() + "年" + (d.getMonth()+1) + "月" + d.getDate() + "日（周" + WEEK[d.getDay()] + "）" +
         " " + String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
}
function fmtDateOnly(ts){
  const d = new Date(ts);
  return d.getFullYear() + "年" + (d.getMonth()+1) + "月" + d.getDate() + "日（周" + WEEK[d.getDay()] + "）";
}
const REGION_BADGE = { cn:"🇨🇳 国内", us:"🇺🇸 美国", eu:"🇪🇺 欧洲", jp:"🇯🇵 日本", uk:"🇬🇧 英国", global:"🌍 全球" };
const CAT_BADGE = { policy:"🏦 政策·央行", tech:"💡 科技", macro:"🌐 宏观", data:"📊 数据" };

/* ============ 3. 提醒设置存储 ============ */
function loadStore(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return { defaultLeadDays:3, settings:{} };
}
let store = loadStore();
function saveStore(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(store)); }catch(e){}
}
function getSetting(id){
  if(!store.settings[id]){
    store.settings[id] = { enabled:false, leadDays:store.defaultLeadDays, leadHours:0, fired:null };
  }
  return store.settings[id];
}
function leadMs(s){ return (Math.max(0, Number(s.leadDays)||0)*86400 + Math.max(0, Number(s.leadHours)||0)*3600) * 1000; }
function firedKeyOf(s){ return (Number(s.leadDays)||0) + "d" + (Number(s.leadHours)||0) + "h"; }

/* ============ 4. 渲染卡片 ============ */
const cardsEl = document.getElementById("cards");
let filter = "all";
let view = "future";      // future 未来 / history 历史
let histEnd = null;       // 历史窗口终点（YYYY-MM-DD）

function isoLocal(d){
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
const TODAY = isoLocal(new Date());
const MIN_HIST = (function(){ // 最多回溯 6 年
  const d = new Date(); d.setFullYear(d.getFullYear() - 6);
  return isoLocal(d);
})();
function histWindow(){
  const end = Date.parse(histEnd + "T23:59:59+08:00");
  const start = end - 365 * 86400 * 1000;
  return { start, end };
}

function statusOf(m){
  const t = now();
  if(t < Date.parse(m.start)) return "upcoming";
  if(t <= Date.parse(m.end)) return "live";
  return "past";
}

function cdParts(ms){
  const s = Math.max(0, Math.floor(ms/1000));
  const d = Math.floor(s/86400), h = Math.floor(s%86400/3600), mi = Math.floor(s%3600/60), se = s%60;
  return { d, h, mi, se };
}

function cdHtml(m, withSeconds){
  const st = statusOf(m);
  if(st === "past") return '<span class="done">已结束</span>';
  if(st === "live") return '<span class="live">● 进行中</span>';
  const p = cdParts(Date.parse(m.start) - now());
  let h = "";
  h += '<div class="num">' + p.d + '</div><span class="u">天</span>';
  h += '<div class="num">' + p.h + '</div><span class="u">时</span>';
  h += '<div class="num">' + p.mi + '</div><span class="u">分</span>';
  if(withSeconds) h += '<div class="num">' + p.se + '</div><span class="u">秒</span>';
  return '<span class="cd">' + h + '</span>';
}

function cardHtml(m, isHist){
  const s = isHist ? { enabled:false, leadDays:0, leadHours:0, fired:null } : getSetting(m.id);
  const st = statusOf(m);
  const fired = !isHist && s.fired === firedKeyOf(s) && s.fired !== null;
  const regionCls = (m.region === "cn") ? "cn" : "overseas";
  const alerted = s.enabled;
  const cdbox = isHist
    ? '<div class="cdbox"><span class="done">📜 已发生 · 历史回顾</span></div>'
    : '<div class="cdbox">' + cdHtml(m, true) + '</div>';
  const remindHtml = isHist
    ? '<div class="remind"><span class="fired">📜 历史回顾 · 已发生</span></div>'
    : '<div class="remind">' +
        '<label><input type="checkbox" class="remind-on" ' + (s.enabled ? "checked" : "") + '> 提醒我</label>' +
        '<span>提前</span>' +
        '<input type="number" class="r-days" min="0" max="365" value="' + (s.leadDays ?? 3) + '">' +
        '<span class="unit">天</span>' +
        '<input type="number" class="r-hours" min="0" max="23" value="' + (s.leadHours ?? 0) + '">' +
        '<span class="unit">小时</span>' +
        (fired ? '<span class="fired">✓ 已提醒</span>' : '') +
        '<button class="test">测试提醒</button>' +
      '</div>';
  return (
    '<div class="card ' + m.level + (isHist ? "" : (st === "past" ? " past" : "")) + '" ' +
      'data-id="' + m.id + '" data-region="' + regionCls + '" data-cat="' + m.cat + '" data-alerted="' + alerted + '"' +
      (isHist ? ' data-hist="true"' : '') + '>' +
      '<div class="card-head">' +
        '<span class="badge">' + REGION_BADGE[m.region] + '</span>' +
        '<span class="badge">' + CAT_BADGE[m.cat] + '</span>' +
        '<span class="badge lv ' + m.level + '">' + m.level + '</span>' +
        (isHist && m.hot ? '<span class="badge hot">⚡ 反转级</span>' : '') +
        (isHist ? '<span class="badge">📜 回顾</span>' : '') +
        '<span class="date">' + fmtDateOnly(Date.parse(m.start)) + '</span>' +
      '</div>' +
      '<h2>' + m.title + '</h2>' +
      '<p class="org">' + m.org + '</p>' +
      cdbox +
      '<p class="impact"><b>对股市影响：</b>' + m.impact + '</p>' +
      '<p class="note">' + m.note + '</p>' +
      remindHtml +
    '</div>'
  );
}

function renderCards(){
  let list;
  if (view === "history") {
    const w = histWindow();
    // 内置历史事件 + 已结束的未来事件（结束后自动归入历史；标题前 3 字相同且日期相近视为同一事件去重）
    const extra = MEETINGS.filter(m => {
      if (statusOf(m) !== "past") return false;
      return !HISTORY.some(h => {
        if (h.id === m.id) return true;
        if (h.title.slice(0, 3) === m.title.slice(0, 3) &&
            Math.abs(Date.parse(h.start) - Date.parse(m.start)) < 45 * 86400000) return true;
        return false;
      });
    });
    const all = HISTORY.concat(extra);
    list = all.filter(m => {
      const t = Date.parse(m.start);
      return t >= w.start && t <= w.end;
    }).sort((a,b) => Date.parse(b.start) - Date.parse(a.start)); // 历史：最近在前
    cardsEl.innerHTML = list.map(m => cardHtml(m, true)).join("");
    document.getElementById("histRange").textContent = "共 " + list.length + " 条";
    document.getElementById("statNext").textContent = list.length ? "回顾窗口共 " + list.length + " 条事件" : "该窗口暂无事件";
  } else {
    // 未来视图只保留未开始 / 进行中的事件；已结束的归入历史
    list = MEETINGS.filter(m => statusOf(m) !== "past")
      .sort((a,b) => Date.parse(a.start) - Date.parse(b.start));
    cardsEl.innerHTML = list.map(m => cardHtml(m, false)).join("");
  }
  applyFilter();
  bindCardEvents();
}

function applyFilter(){
  document.querySelectorAll(".filters button[data-f]").forEach(b => b.classList.toggle("on", b.dataset.f === filter));
  cardsEl.querySelectorAll(".card").forEach(card => {
    let show = true;
    if(filter === "cn") show = card.dataset.region === "cn";
    else if(filter === "overseas") show = card.dataset.region === "overseas";
    else if(filter === "policy") show = card.dataset.cat === "policy";
    else if(filter === "tech") show = card.dataset.cat === "tech";
    else if(filter === "alerted") show = card.dataset.alerted === "true";
    card.style.display = show ? "" : "none";
  });
}

/* ============ 5. 卡片交互 ============ */
function bindCardEvents(){
  cardsEl.querySelectorAll(".card").forEach(card => {
    if(card.dataset.hist === "true") {
      // 历史卡：点击进入二级页面（内容要点 + K 线回顾）
      card.addEventListener("click", () => { location.hash = "#detail/" + encodeURIComponent(card.dataset.id); });
      return;
    }
    // 未来卡：也可点击查看会议内容与影响（排除提醒控件区域）
    card.addEventListener("click", (e) => {
      const t = e && e.target;
      if (t && t.tagName === "INPUT") return;
      if (t && t.closest && (t.closest(".remind") || t.closest(".test"))) return;
      location.hash = "#detail/" + encodeURIComponent(card.dataset.id);
    });
    const id = card.dataset.id;
    const m = MEETINGS.find(x => x.id === id);
    const s = getSetting(id);

    card.querySelector(".remind-on").addEventListener("change", e => {
      s.enabled = e.target.checked;
      if(!s.enabled) s.fired = null;
      card.dataset.alerted = String(s.enabled);
      saveStore(); refreshStats();
    });
    card.querySelector(".r-days").addEventListener("change", e => {
      s.leadDays = Math.max(0, parseInt(e.target.value) || 0);
      s.fired = null; saveStore(); refreshStats();
    });
    card.querySelector(".r-hours").addEventListener("change", e => {
      s.leadHours = Math.max(0, Math.min(23, parseInt(e.target.value) || 0));
      s.fired = null; saveStore(); refreshStats();
    });
    card.querySelector(".test").addEventListener("click", () => {
      const lead = leadMs(s);
      const left = Date.parse(m.start) - now();
      const cd = left > 0 ? "距开始还有 " + fmtLeft(Math.max(0, left)) : "已开始 / 已结束";
      fireReminder(m, "（测试）" + cd + "，实际提醒点：提前 " + s.leadDays + " 天 " + s.leadHours + " 小时", true);
    });
  });
}

function fmtLeft(ms){
  const p = cdParts(ms);
  let out = "";
  if(p.d > 0) out += p.d + " 天 ";
  if(p.h > 0) out += p.h + " 小时 ";
  if(p.mi > 0) out += p.mi + " 分 ";
  out += p.se + " 秒";
  return out;
}

/* ============ 6. 倒计时刷新 ============ */
function tick(){
  const t = new Date();
  const week = "日一二三四五六"[t.getDay()];
  document.getElementById("today").textContent =
    t.getFullYear() + "年" + (t.getMonth()+1) + "月" + t.getDate() + "日 星期" + week;
  document.getElementById("liveClock").textContent =
    String(t.getHours()).padStart(2,"0") + ":" + String(t.getMinutes()).padStart(2,"0") + ":" + String(t.getSeconds()).padStart(2,"0");

  document.querySelectorAll(".card .cdbox").forEach(box => {
    const card = box.closest(".card");
    if(card.dataset.hist === "true") return; // 历史卡不刷新倒计时
    const m = MEETINGS.find(x => x.id === card.dataset.id);
    if(!m) return;
    const html = cdHtml(m, true);
    if(box.innerHTML !== html) box.innerHTML = html;
  });

  // 统计：距最近大事件（仅未来视图）
  if (view === "future") {
    const n = now();
    const next = MEETINGS.map(m => ({ m, t: Date.parse(m.start) }))
      .filter(x => x.t > n && x.t - n > 0)
      .sort((a,b) => a.t - b.t)[0];
    if(next) document.getElementById("statNext").textContent = "还有 " + fmtLeft(next.t - n);
    else document.getElementById("statNext").textContent = "—";
  }
}

function refreshStats(){
  let alerts = 0, fired = 0;
  MEETINGS.forEach(m => {
    const s = getSetting(m.id);
    if(s.enabled) alerts++;
    if(s.fired === firedKeyOf(s) && s.fired !== null) fired++;
  });
  document.getElementById("statAlerts").textContent = alerts;
  document.getElementById("statFired").textContent = fired;
}

/* ============ 7. 提醒触发 ============ */
let audioCtx = null;
function beep(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === "suspended") audioCtx.resume();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = "sine"; o.frequency.value = 880;
    g.gain.setValueAtTime(0.001, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.18, audioCtx.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.55);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + 0.6);
    setTimeout(() => {
      const o2 = audioCtx.createOscillator(), g2 = audioCtx.createGain();
      o2.type = "sine"; o2.frequency.value = 1175;
      g2.gain.setValueAtTime(0.001, audioCtx.currentTime);
      g2.gain.exponentialRampToValueAtTime(0.18, audioCtx.currentTime + 0.02);
      g2.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.55);
      o2.connect(g2); g2.connect(audioCtx.destination);
      o2.start(); o2.stop(audioCtx.currentTime + 0.6);
    }, 380);
  }catch(e){}
}

function fireReminder(m, sub, isTest){
  const left = Date.parse(m.start) - now();
  document.getElementById("mEv").textContent = m.title;
  document.getElementById("mCd").textContent = left > 0
    ? "距开始还有 " + fmtLeft(left)
    : (now() <= Date.parse(m.end) ? "会议进行中" : "会议已结束");
  document.getElementById("mSub").textContent = sub + " · " + (m.org || "");
  document.getElementById("modal").classList.add("show");
  beep();
  try{
    if("Notification" in window && Notification.permission === "granted"){
      const n = new Notification("⏰ 重大事件提醒：" + m.title, {
        body: sub,
        tag: "eventradar-" + m.id
      });
      n.onclick = () => { window.focus(); };
    }
  }catch(e){}
  // 标题闪烁
  let on = false;
  const t = setInterval(() => { on = !on; document.title = (on ? "🔔 " : "") + "重大事件提醒 · 股市日历"; }, 800);
  setTimeout(() => { clearInterval(t); document.title = "重大事件提醒 · 股市日历"; }, 16000);
  // 声音恢复
  if(audioCtx && audioCtx.state === "suspended") audioCtx.resume();
}

function checkReminders(){
  const n = now();
  MEETINGS.forEach(m => {
    const s = getSetting(m.id);
    if(!s.enabled) return;
    const start = Date.parse(m.start);
    const due = start - leadMs(s);
    const key = firedKeyOf(s);
    if(n >= due && n < start && s.fired !== key){
      s.fired = key;
      saveStore();
      refreshStats();
      fireReminder(m, "提醒时间到：该事件将在 " + s.leadDays + " 天 " + s.leadHours + " 小时提醒（实际已到期）", false);
    }
  });
}

document.getElementById("btnNotify").addEventListener("click", async () => {

/* ============ 8.5 历史详情页：事件当天前后 30 天 K 线 ============ */
let kdata = null;
let kdataPromise = null;

// 在线更新（手机 App 无需重装 APK 即可更新行情；默认走 GitHub Pages 公网地址，任何网络可用）
const ONLINE_KEY = "eventRadar.indices.latest.v1";
const DEFAULT_ONLINE_URL = "https://JAVAChrisGong.github.io/event-alerts/data/indices.js";
function onlineUrl(){
  try { return localStorage.getItem("eventRadar.onlineUrl") || DEFAULT_ONLINE_URL; }
  catch(e) { return DEFAULT_ONLINE_URL; }
}
function readCachedLatest(){
  try {
    const s = localStorage.getItem(ONLINE_KEY);
    return s ? JSON.parse(s) : null;
  } catch(e) { return null; }
}
function saveCachedLatest(d){
  try { localStorage.setItem(ONLINE_KEY, JSON.stringify(d)); } catch(e) {}
}

function ensureData(){
  if (kdata) return Promise.resolve(kdata);
  // 0) 之前在线更新过的最新数据（比内置新则优先）
  const lt = readCachedLatest();
  const built = window.INDICES_DATA;
  if (lt && lt.indices && lt.indices.length >= 8 && built) {
    const cachedT = Date.parse(lt.generatedAt || 0);
    const builtT = Date.parse(built.generatedAt || 0);
    if (cachedT > builtT) { kdata = lt; return Promise.resolve(kdata); }
  }
  // 1) 内置数据（APK / 网页 assets）
  if (built) { kdata = built; return Promise.resolve(kdata); }
  // 2) fetch 兜底
  if (!kdataPromise) {
    kdataPromise = fetch("data/indices.json").then(r => r.ok ? r.json() : null).catch(() => null);
  }
  return kdataPromise.then(d => { kdata = d; return d; });
}

let onlineBusy = false;
function onlineLoadScript(){
  return new Promise((resolve) => {
    const s = document.createElement("script");
    s.src = onlineUrl() + "?t=" + Date.now();
    s.onload = () => resolve(true);
    s.onerror = () => resolve(false);
    document.head.appendChild(s);
  });
}
async function tryOnlineUpdate(silent){
  if (onlineBusy) return false;
  onlineBusy = true;
  const ok = await onlineLoadScript();
  onlineBusy = false;
  const d = (ok && window.INDICES_DATA && window.INDICES_DATA.indices && window.INDICES_DATA.indices.length >= 8) ? window.INDICES_DATA : null;
  if (d) {
    kdata = d;
    saveCachedLatest(d);
    const m = (location.hash || "").match(/^#detail\/([^/]+)$/);
    if (m) {
      const ev = HISTORY.find(x => x.id === decodeURIComponent(m[1])) || MEETINGS.find(x => x.id === decodeURIComponent(m[1]));
      if (ev) { document.getElementById("chartGrid").innerHTML = ""; renderChartGrid(ev, false); }
    }
    if (!silent) alert("✅ 行情数据已更新至 " + fmtSnapshotTime(d.generatedAt));
    return true;
  }
  if (!silent) alert("⚠ 更新失败：请检查网络连接后重试（有网即可，数据从 GitHub 自动获取，无需电脑）。");
  return false;
}

// APK（file://）下自动拉取最新行情：打开 App 或进入详情页时尝试，10 分钟内只拉一次
function maybeAutoRefresh(){
  if (location.protocol !== "file:" && location.protocol !== "content:") return;
  try {
    const last = +localStorage.getItem("eventRadar.lastAutoRefresh") || 0;
    if (Date.now() - last < 10 * 60 * 1000) return;
    localStorage.setItem("eventRadar.lastAutoRefresh", String(Date.now()));
  } catch(e) {}
  tryOnlineUpdate(true);
}

  document.getElementById("chartGrid").innerHTML = "";

function idxAtDate(bars, dateStr){
  let idx = -1;
  for (let i = bars.length - 1; i >= 0; i--) {
    if (bars[i][0] <= dateStr) { idx = i; break; }
  }
  return idx;
}

function fmtSnapshotTime(iso){
  if (!iso) return "未知";
  const d = new Date(iso);
  if (isNaN(d.getTime())) return "未知";
  const p = n => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth()+1) + "-" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes());
}

function calcMA(bars, n){
  const out = new Array(bars.length).fill(null);
  let sum = 0;
  for (let i = 0; i < bars.length; i++) {
    sum += bars[i][2];
    if (i >= n) sum -= bars[i - n][2];
    if (i >= n - 1) out[i] = sum / n;
  }
  return out;
}

function drawChart(canvas, bars, mas, evDate, winSize){
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth || 340;
  const h = canvas.clientHeight || 280;
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  const ctx = canvas.getContext("2d");
  if (!ctx) return null;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);

  const idx = idxAtDate(bars, evDate);
  if (idx < 0) return null;
  // 可调窗口：默认 121 根（前后各 60），范围 30 ~ 360 根，事件日居中
  const want = Math.max(30, Math.min(360, Math.floor(winSize) || 121));
  const n0 = bars.length;
  const ww = Math.min(want, n0);
  let start = idx - Math.floor((ww - 1) / 2);
  start = Math.max(0, Math.min(start, n0 - ww));
  const end = start + ww;
  const win = bars.slice(start, end);
  if (win.length < 2) return null;

  let lo = Infinity, hi = -Infinity, vmax = 1;
  for (const b of win) {
    if (b[4] < lo) lo = b[4];
    if (b[3] > hi) hi = b[3];
    if (b[5] > vmax) vmax = b[5];
  }
  const pad = (hi - lo) * 0.08 || 1;
  lo -= pad; hi += pad;

  const L = 8, R = w - 8, T = 16;
  const qH = Math.max(46, h * 0.24);   // 成交量区高度
  const K = h - qH - 10;               // K 线区底部
  const qTop = K + 10, qBot = h - 8;   // 成交量区
  const n = win.length;
  const slot = (R - L) / n;
  const xOf = i => L + i * slot + slot / 2;
  const yOf = v => K - (v - lo) / (hi - lo) * (K - T);
  const yVol = v => qBot - (v / vmax) * (qBot - qTop);

  // 网格（K 线区）
  ctx.strokeStyle = "rgba(139,150,173,.14)";
  ctx.lineWidth = 1;
  for (let g = 0; g <= 4; g++) {
    const gy = T + (K - T) * g / 4;
    ctx.beginPath(); ctx.moveTo(L, gy); ctx.lineTo(R, gy); ctx.stroke();
  }
  // 量区上沿
  ctx.beginPath(); ctx.moveTo(L, qTop); ctx.lineTo(R, qTop); ctx.stroke();

  // 蜡烛 + 成交量
  const bw = Math.max(1.5, slot * 0.7);
  for (let i = 0; i < n; i++) {
    const b = win[i];
    const up = b[2] >= b[1];
    ctx.strokeStyle = ctx.fillStyle = up ? "#ef476f" : "#2ec27e";
    const cx = xOf(i);
    ctx.beginPath(); ctx.moveTo(cx, yOf(b[3])); ctx.lineTo(cx, yOf(b[4])); ctx.stroke();
    const top = yOf(Math.max(b[1], b[2])), bot = yOf(Math.min(b[1], b[2]));
    ctx.fillRect(cx - bw / 2, top, bw, Math.max(1, bot - top));
    // 成交量柱
    const vy = yVol(b[5]);
    ctx.fillRect(cx - bw / 2, vy, bw, Math.max(1, qBot - vy));
  }

  // 均线 MA5 / MA10 / MA20
  const drawMA = (arr, color) => {
    if (!arr) return;
    ctx.strokeStyle = color; ctx.lineWidth = 1.4;
    ctx.beginPath();
    let started = false;
    for (let i = 0; i < n; i++) {
      const v = arr[start + i];
      if (v == null) continue;
      const px = xOf(i), py = yOf(v);
      if (!started) { ctx.moveTo(px, py); started = true; }
      else ctx.lineTo(px, py);
    }
    ctx.stroke();
  };
  drawMA(mas && mas.ma5, "#ffd166");
  drawMA(mas && mas.ma10, "#4cc9f0");
  drawMA(mas && mas.ma20, "#b388ff");
  drawMA(mas && mas.ma60, "#f7b731");
  drawMA(mas && mas.ma240, "#ff6b9d");

  // 事件日竖线（贯穿 K 线区与量区）
  const evI = idx - start;
  if (evI >= 0 && evI < n) {
    const ex = xOf(evI);
    ctx.strokeStyle = "#ffd166"; ctx.lineWidth = 1.2; ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.moveTo(ex, T); ctx.lineTo(ex, qBot); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = "#ffd166"; ctx.font = "11px sans-serif"; ctx.textAlign = "center";
    ctx.fillText("事件日", ex, T - 3);
  }

  // 底部日期
  ctx.fillStyle = "rgba(139,150,173,.7)"; ctx.font = "10px sans-serif"; ctx.textAlign = "left";
  ctx.fillText(win[0][0], L, h - 1);
  ctx.textAlign = "right";
  ctx.fillText(win[n-1][0], R, h - 1);

  return { start: win[0][0], end: win[n-1][0], firstClose: win[0][2], lastClose: win[n-1][2] };
}

async function renderChartGrid(ev, isFuture){
  const grid = document.getElementById("chartGrid");
  const hint = document.getElementById("chartHint");
  if (isFuture) {
    hint.textContent = "⏳ 该会议尚未召开，暂无 K 线数据；会议结束后更新数据（双击「更新行情数据.cmd」或等待每日自动更新）即可查看前后 60 天行情。";
    grid.innerHTML = "";
    return;
  }
  hint.textContent = "正在加载指数 K 线数据…";
  grid.innerHTML = "";
  const data = await ensureData();
  if (!data || !data.indices) {
    hint.textContent = "⚠ 指数数据加载失败：请确认 data/indices.js 与 index.html 在同一目录（或通过本地服务器打开），打包 APK 后数据会内置。";
    return;
  }
  hint.textContent = "📊 行情数据快照：" + fmtSnapshotTime(data.generatedAt) + "（数据更新后刷新本页即可看到最新 K 线）";
  const evDate = ev.start.slice(0, 10);
  for (const it of data.indices) {
    const card = document.createElement("div");
    card.className = "chart-card";
    card.innerHTML = '<h3>' + it.name + ' <small>' + it.market + '</small></h3>' +
      '<canvas></canvas>' +
      '<div class="chart-slider">' +
        '<input type="range" min="30" max="360" step="1" value="121">' +
        '<span class="win-label">121 根</span>' +
      '</div>' +
      '<div class="chart-legend">' +
        '<span><i style="background:#ffd166"></i>MA5</span>' +
        '<span><i style="background:#4cc9f0"></i>MA10</span>' +
        '<span><i style="background:#b388ff"></i>MA20</span>' +
        '<span><i style="background:#f7b731"></i>MA60</span>' +
        '<span><i style="background:#ff6b9d"></i>MA240</span>' +
        '<span><i style="background:#ef476f"></i>红涨</span>' +
        '<span><i style="background:#2ec27e"></i>绿跌</span>' +
        '<span>底部柱：成交量</span>' +
      '</div>' +
      '<div class="chart-meta"><span class="range">—</span><span class="chg">—</span></div>';
    grid.appendChild(card);
    await new Promise(r => setTimeout(r, 0));
    const mas = { ma5: calcMA(it.bars, 5), ma10: calcMA(it.bars, 10), ma20: calcMA(it.bars, 20), ma60: calcMA(it.bars, 60), ma240: calcMA(it.bars, 240) };
    const canvas = card.querySelector("canvas");
    const slider = card.querySelector(".chart-slider input");
    const label = card.querySelector(".win-label");
    const redraw = (w) => {
      const info = drawChart(canvas, it.bars, mas, evDate, w);
      if (info) {
        card.querySelector(".range").textContent = info.start + " ~ " + info.end;
        const chg = (info.lastClose / info.firstClose - 1) * 100;
        const chgEl = card.querySelector(".chg");
        chgEl.textContent = (chg >= 0 ? "+" : "") + chg.toFixed(2) + "%";
        chgEl.style.color = chg >= 0 ? "#ef476f" : "#2ec27e";
      }
    };
    slider.addEventListener("input", () => {
      const w = parseInt(slider.value) || 121;
      label.textContent = w + " 根";
      redraw(w);
    });
    redraw(121);
  }
}

function route(){
  const m = (location.hash || "").match(/^#detail\/([^/]+)$/);
  if (m) openDetail(decodeURIComponent(m[1]));
  else closeDetail();
}
